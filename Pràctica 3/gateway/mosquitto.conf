# Fitxer: Pràctica 3/gateway/mosquitto.conf

# 1. Configurar el listener per escoltar al port 1883 en totes les interfícies de xarxa
listener 1883 0.0.0.0

# 2. Permetre connexions anònimes (necessari en entorns de prova locals)
allow_anonymous true

# 3. Activar la persistència de dades (missatges retinguts i subscripcions)
persistence true

# 4. Ubicació on es guardarà la base de dades persistent (mosquitto.db)
# persistence_location /var/lib/mosquitto/